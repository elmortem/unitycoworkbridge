name: AgentBridge CLI

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing agentbridge-v* tag to package or repair
        required: true
        default: agentbridge-v1.3.0
        type: string
  push:
    branches:
      - main
      - roslyn-cli
    tags:
      - agentbridge-v*
    paths:
      - AgentBridgeCli/**
      - AgentBridgeCli.Tests/**
      - scripts/install-agentbridge.*
      - .github/workflows/agentbridge-cli.yml
  pull_request:
    paths:
      - AgentBridgeCli/**
      - AgentBridgeCli.Tests/**
      - scripts/install-agentbridge.*
      - .github/workflows/agentbridge-cli.yml

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  SOURCE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}

jobs:
  test:
    strategy:
      matrix:
        os:
          - windows-latest
          - macos-latest
          - ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout source
        shell: pwsh
        run: |
          git init .
          git remote add origin "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY.git"
          git fetch --depth 1 origin "$env:SOURCE_REF"
          git checkout --detach FETCH_HEAD
      - run: dotnet build AgentBridgeCli/AgentBridgeCli.csproj -c Release
      - run: dotnet run --project AgentBridgeCli.Tests/AgentBridgeCli.Tests.csproj -c Release

  ensure-release:
    if: startsWith(github.ref, 'refs/tags/agentbridge-v') || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create release when absent
        shell: bash
        run: |
          if [[ "$RELEASE_TAG" != agentbridge-v* ]]; then
            echo "Release tag must start with agentbridge-v: $RELEASE_TAG" >&2
            exit 1
          fi
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --generate-notes --title "$RELEASE_TAG"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

  package:
    if: startsWith(github.ref, 'refs/tags/agentbridge-v') || github.event_name == 'workflow_dispatch'
    needs:
      - test
      - ensure-release
    strategy:
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
          - rid: win-arm64
            os: windows-latest
          - rid: osx-x64
            os: macos-latest
          - rid: osx-arm64
            os: macos-latest
          - rid: linux-x64
            os: ubuntu-latest
          - rid: linux-arm64
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - name: Checkout source
        shell: pwsh
        run: |
          git init .
          git remote add origin "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY.git"
          git fetch --depth 1 origin "$env:SOURCE_REF"
          git checkout --detach FETCH_HEAD
      - name: Validate release version
        shell: pwsh
        run: |
          $releaseTag = $env:RELEASE_TAG
          if (-not $releaseTag.StartsWith("agentbridge-v")) {
            throw "Release tag must start with agentbridge-v: $releaseTag"
          }
          $tagVersion = $releaseTag.Substring("agentbridge-v".Length)
          [xml]$project = Get-Content AgentBridgeCli/AgentBridgeCli.csproj
          $projectVersion = [string]$project.Project.PropertyGroup.Version
          if ($projectVersion -ne $tagVersion) {
            throw "Tag version $tagVersion does not match AgentBridgeCli version $projectVersion"
          }
      - run: dotnet publish AgentBridgeCli/AgentBridgeCli.csproj -c Release -r ${{ matrix.rid }} --self-contained true -o publish/${{ matrix.rid }}
      - name: Validate published executable
        shell: pwsh
        run: |
          $rid = "${{ matrix.rid }}"
          $executable = if ($rid.StartsWith("win-")) {
            "publish/$rid/agentbridge.exe"
          } else {
            "publish/$rid/agentbridge"
          }
          if (-not (Test-Path $executable -PathType Leaf)) {
            throw "Published CLI executable is missing: $executable"
          }
          if ((Get-Item $executable).Length -le 0) {
            throw "Published CLI executable is empty: $executable"
          }
      - name: Smoke published CLI
        if: ${{ !endsWith(matrix.rid, '-arm64') }}
        shell: pwsh
        run: |
          $rid = "${{ matrix.rid }}"
          $executable = if ($rid.StartsWith("win-")) {
            "publish/$rid/agentbridge.exe"
          } else {
            "publish/$rid/agentbridge"
          }
          & $executable --version
          if ($LASTEXITCODE -ne 0) {
            throw "Published CLI smoke test failed with exit code $LASTEXITCODE"
          }
      - name: Pack
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          $rid = "${{ matrix.rid }}"
          if ($rid.StartsWith("win-")) {
            $archive = "agentbridge-$rid.zip"
            Compress-Archive "publish/$rid/agentbridge.exe" "artifacts/$archive"
          } else {
            $archive = "agentbridge-$rid.tar.gz"
            tar -czf "artifacts/$archive" -C "publish/$rid" agentbridge
          }
          $hash = (Get-FileHash "artifacts/$archive" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $archive" | Set-Content "artifacts/$archive.sha256" -NoNewline
      - name: Upload release assets
        shell: pwsh
        run: |
          gh release upload $env:RELEASE_TAG artifacts/* --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
