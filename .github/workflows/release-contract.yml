name: Release Contract

on:
  pull_request:
    paths:
      - AgentBridgeCli/**
      - AgentBridgeCli.Tests/**
      - AgentBridgeUnity/Packages/com.elmortem.agentbridge/**
      - unity-bridge-plugin/**
      - scripts/build-plugin.ps1
      - .github/workflows/release-contract.yml
  push:
    branches:
      - main
      - roslyn-cli
    paths:
      - AgentBridgeCli/**
      - AgentBridgeCli.Tests/**
      - AgentBridgeUnity/Packages/com.elmortem.agentbridge/**
      - unity-bridge-plugin/**
      - scripts/build-plugin.ps1
      - .github/workflows/release-contract.yml

jobs:
  validate-release-contract:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        shell: pwsh
        run: |
          git init .
          git config core.autocrlf false
          git config core.eol lf
          git remote add origin "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY.git"
          git fetch --no-tags origin "$env:GITHUB_SHA"
          git checkout --detach FETCH_HEAD

      - name: Resolve comparison base
        shell: pwsh
        run: |
          $baseRef = if ("${{ github.event_name }}" -eq "pull_request") {
            "${{ github.event.pull_request.base.sha }}"
          } else {
            "${{ github.event.before }}"
          }
          if ([string]::IsNullOrWhiteSpace($baseRef) -or $baseRef -match '^0+$') {
            $baseRef = (git rev-parse HEAD^).Trim()
          }
          "RELEASE_BASE_REF=$baseRef" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Validate committed versions and plugin ZIP
        shell: pwsh
        run: ./scripts/build-plugin.ps1 -BaseRef $env:RELEASE_BASE_REF -ValidateOnly

      - name: Build validated plugin artifact
        shell: pwsh
        run: ./scripts/build-plugin.ps1 -SkipVersionCheck -OutputPath "$env:RUNNER_TEMP/unity-bridge-plugin.zip"

      - name: Verify built plugin artifact
        shell: pwsh
        run: |
          $artifactPath = Join-Path $env:RUNNER_TEMP "unity-bridge-plugin.zip"
          if (-not (Test-Path $artifactPath -PathType Leaf)) {
            throw "Plugin artifact is missing: $artifactPath"
          }

          $artifact = Get-Item $artifactPath
          if ($artifact.Length -le 0) {
            throw "Plugin artifact is empty: $artifactPath"
          }

          $hash = (Get-FileHash $artifactPath -Algorithm SHA256).Hash.ToLowerInvariant()
          "### Validated plugin artifact" | Out-File $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          "- File: ``$($artifact.Name)``" | Out-File $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          "- Size: $($artifact.Length) bytes" | Out-File $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          "- SHA-256: ``$hash``" | Out-File $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
